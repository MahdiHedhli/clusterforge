name: Curriculum checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out curriculum
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the offline validator
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate curriculum structure and local links
        run: python3 tooling/validate_curriculum.py
